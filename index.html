<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <meta name="description" content="A practical German vocabulary learning app.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <title>German 1000</title>
  <style>
    :root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#111827;background:#f8fafc}
    *{box-sizing:border-box}body{margin:0}main{max-width:720px;margin:auto;padding:24px 18px 40px}
    button,input{font:inherit}button{cursor:pointer;min-height:48px;border-radius:14px;padding:11px 16px;border:1px solid #d1d5db;background:white}
    button.primary{background:#111827;color:white;border-color:#111827;width:100%;font-weight:700;padding:16px}
    button:focus,input:focus{outline:3px solid #c7d2fe;outline-offset:2px}
    .top{display:flex;justify-content:space-between;gap:20px;align-items:end}.muted{color:#6b7280}.big{font-size:42px;font-weight:750;letter-spacing:-.04em}
    .bar{height:8px;background:#e5e7eb;border-radius:99px;overflow:hidden;margin:14px 0 22px}.fill{height:100%;background:#111827;width:0}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}.card{border:1px solid #d1d5db;border-radius:18px;background:white;padding:22px}
    .hero{text-align:center;padding:40px 20px}.word{font-size:clamp(42px,11vw,72px);font-weight:750;line-height:1.05;margin:22px 0}
    .actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}.hidden{display:none!important}
    .choices{display:flex;flex-direction:column;gap:10px;max-width:460px;margin:18px auto}.choices button{text-align:left}
    input{width:100%;border:1px solid #d1d5db;border-radius:14px;padding:13px;background:white}
    .row{display:flex;justify-content:space-between;gap:12px;align-items:center}.list{display:flex;flex-direction:column;gap:8px}.item{padding:13px;border:1px solid #e5e7eb;border-radius:12px;background:white}
    @media(max-width:520px){main{padding:18px 14px 32px}.grid{grid-template-columns:1fr}.big{font-size:36px}}
  </style>
</head>

const KEY="german1000.v1";
let state=JSON.parse(localStorage.getItem(KEY)||"null")||{
  items:CORE.map((x,i)=>({id:i,g:x[0],e:x[1],type:x[2],level:0,seen:0,wrong:0,next:0,personal:false})),
  session:[],
  settings:{dailyNew:5}
};
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function now(){return Date.now()}
function due(x){return x.next<=now()}
function mastered(x){return x.level>=5}
function priority(x){
  const g=x.g.toLowerCase(), e=x.e.toLowerCase();
  const top=["sein","haben","können","müssen","wollen","möchten","gehen","kommen","machen","geben","nehmen","brauchen","wissen","verstehen","sprechen","sagen","sehen","finden","fragen","helfen","kaufen","bezahlen","essen","trinken","schlafen","arbeiten","lernen","heute","morgen","jetzt","hier","dort","was","wer","wo","wann","warum","wie","ich","du","sie","wir","ja","nein","bitte","danke","entschuldigung","wasser","kaffee","essen","toilette","bahnhof","ticket","hotel","arzt"];
  let p=0;
  if(top.includes(g)) p+=1000;
  if(x.type==="p") p+=350;
  if(x.personal) p+=900;
  if(/\b(ich|du|sie|wir|wo|was|wie|kann|möchte|brauche|habe|muss|will)\b/.test(g)) p+=120;
  if(e.includes("to ")) p+=40;
  return p;
}
function stats(){return {
  mastered:state.items.filter(mastered).length,
  due:state.items.filter(x=>!mastered(x)&&due(x)).length,
  weak:state.items.filter(x=>x.wrong>=2&&!mastered(x)).length,
  new:state.items.filter(x=>x.seen===0).length
}}
function schedule(x,ok){
  const intervals=[0,0,1,2,4,8,16,30];
  if(ok)x.level=Math.min(7,x.level+1);
  else{x.level=Math.max(0,x.level-1);x.wrong++}
  x.seen++;
  const days=intervals[x.level]||30;
  x.next=now()+days*86400000;
  save();
}
function home(){
 const s=stats();
 app.innerHTML=`<section>
 <div class="top"><div><div class="muted">German · personal vocabulary</div><div class="big">${s.mastered} / 1,000</div></div>
 <div class="muted" style="text-align:right">${s.due} due<br>${s.weak} weak</div></div>
 <div class="bar"><div class="fill" style="width:${s.mastered/10}%"></div></div>
 <button class="primary" id="start">Start review<br><small>Highest-priority items first</small></button>
 <div class="grid"><button id="new">Learn new<br><small>${s.new} new available</small></button><button id="weak">Practice weak<br><small>${s.weak} items</small></button></div>
 <div class="grid"><button id="add">+ Add personal word</button><button id="browse">My vocabulary</button></div><p class="muted" style="margin-top:18px;font-size:14px">Tip: once hosted, use your browser menu → Add to Home Screen to make it feel like an app.</p>
 </section>`;
 start.onclick=()=>begin("review");document.getElementById("new").onclick=()=>begin("new");weak.onclick=()=>begin("weak");add.onclick=addView;browse.onclick=browseView;
}
function begin(kind){
 let a=state.items.filter(x=>kind==="new"?x.seen===0:kind==="weak"?x.wrong>0:!mastered(x)&&due(x));
 if(!a.length)a=state.items.filter(x=>!mastered(x)).sort((a,b)=>priority(b)-priority(a)||a.level-b.level).slice(0,10);
 if(kind==="new")a=a.slice(0,state.settings.dailyNew);
 a=a.sort((a,b)=>priority(b)-priority(a)||a.level-b.level||a.seen-b.seen).slice(0,10);
 state.session=a.map(x=>x.id);save();sessionView(0);
}
function sessionView(pos){
 if(pos>=state.session.length){doneView();return}
 const x=state.items.find(y=>y.id===state.session[pos]);
 const typing=x.seen>0 && x.level>=2;
 app.innerHTML=`<section>
 <div class="row"><button id="stop">Stop</button><span class="muted">${pos+1} / ${state.session.length}</span></div>
 <div class="bar"><div class="fill" style="width:${(pos+1)/state.session.length*100}%"></div></div>
 <div class="card hero"><div class="muted">${typing?"Active recall":x.type==="p"?"Useful phrase":"Recognition"}</div>
 <div class="word">${esc(typing?x.e:x.g)}</div>
 <div class="muted">${typing?"Type the German":x.type==="p"?"What does this mean?":"What does this mean?"}</div>
 <div id="answer" class="hidden" style="font-size:25px;font-weight:650;margin:22px">${esc(x.e)}</div>
 ${typing?`<input id="typed" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="Type the German">`:""}
 <div id="feedback" class="muted" style="min-height:24px;margin:18px 0"></div>
 <div class="actions">${typing?`<button class="primary" id="check" style="width:auto">Check</button>`:`<button id="reveal">Reveal</button>`}
 <button class="hidden" id="known">✓ Knew it</button><button class="hidden" id="missed">× Didn't know</button>
 <button class="hidden" id="next" class="primary">Next</button></div></div>
 </section>`;
 stop.onclick=home;
 if(typing){typed.focus();check.onclick=()=>grade(x,normalize(typed.value)===normalize(x.g),pos)}
 else reveal.onclick=()=>{answer.classList.remove("hidden");reveal.classList.add("hidden");known.classList.remove("hidden");missed.classList.remove("hidden")}
 known.onclick=()=>grade(x,true,pos);missed.onclick=()=>grade(x,false,pos);
}
function normalize(s){return s.toLowerCase().trim().replace(/[.!?,;:]+$/,"").replace(/\\s+/g," ")}
function grade(x,ok,pos){
 schedule(x,ok);
 feedback.textContent=ok?"Correct.":"Not quite — "+x.g;
 known?.classList.add("hidden");missed?.classList.add("hidden");document.getElementById("check")?.classList.add("hidden");
 next.classList.remove("hidden");next.onclick=()=>sessionView(pos+1);
}
function doneView(){
 const s=stats();
 app.innerHTML=`<section class="card hero"><div class="muted">Session complete</div><div class="word">Done</div><p>${s.mastered} of 1,000 core items are currently strong.</p><button class="primary" id="back">Back home</button></section>`;
 back.onclick=home;
}

 app.innerHTML=`<section><div class="row"><h2>My vocabulary</h2><button id="back">Close</button></div>

 back.onclick=home;
